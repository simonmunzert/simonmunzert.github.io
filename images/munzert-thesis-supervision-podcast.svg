<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 555" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e7e7e2" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- paper background -->
  <rect width="1000" height="555" fill="#f5f5f1"/>
  <rect width="1000" height="555" fill="url(#grid)"/>

  <!-- card with blue offset shadow (matching the video tile) -->
